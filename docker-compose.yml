name: revolt-gui

services:
    db:
        image: postgis/postgis:16-3.4-alpine
        restart: unless-stopped
        environment:
            POSTGRES_USER: ${POSTGRES_USER}
            POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
            POSTGRES_DB: ${POSTGRES_DB}
        volumes:
            - pgdata:/var/lib/postgresql/data
            - ./infra/db/init:/docker-entrypoint-initdb.d:ro
        ports:
            - "5432:5432"
        healthcheck:
            test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
            interval: 5s
            timeout: 5s
            retries: 10
            start_period: 10s

    tailscale:
        image: tailscale/tailscale:latest
        restart: unless-stopped
        hostname: ${TS_HOSTNAME:-revolt-gui-dev}
        environment:
            TS_AUTHKEY: ${TAILSCALE_AUTHKEY:-}
            TS_STATE_DIR: /var/lib/tailscale
            TS_ACCEPT_DNS: "false"
            TS_EXTRA_ARGS: "--accept-routes"
        volumes:
            - tailscale_data:/var/lib/tailscale
            - /dev/net/tun:/dev/net/tun
        cap_add:
            - net_admin
            - sys_module
        ports:
            - "8000:8000"

    backend:
        build:
            context: .
            dockerfile: apps/backend/Dockerfile
            target: dev
        restart: unless-stopped
        env_file: .env
        volumes:
            - ./apps/backend/src:/app/src:cached
        network_mode: "service:tailscale"
        depends_on:
            tailscale:
                condition: service_started
            db:
                condition: service_healthy
        healthcheck:
            test: ["CMD-SHELL", "curl -f http://localhost:8000/api/health || exit 1"]
            interval: 10s
            timeout: 5s
            retries: 5
            start_period: 20s

    frontend:
        build:
            context: .
            dockerfile: apps/frontend/Dockerfile
            target: dev
        restart: unless-stopped
        environment:
            VITE_API_BASE_URL: http://tailscale:8000
        volumes:
            - ./apps/frontend/src:/app/apps/frontend/src:cached
            - ./apps/frontend/index.html:/app/apps/frontend/index.html:cached
            - ./packages:/app/packages:cached
            - frontend_nm:/app/node_modules
            - frontend_app_nm:/app/apps/frontend/node_modules
        ports:
            - "5173:5173"
        depends_on:
            - backend

volumes:
    pgdata:
        name: revolt-pgdata
    tailscale_data:
        name: revolt-tailscale-data
    frontend_nm:
        name: revolt-frontend-nm
    frontend_app_nm:
        name: revolt-frontend-app-nm
