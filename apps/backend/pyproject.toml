[project]
name = "revolt-api"
version = "0.1.0"
description = "Revolt GUI FastAPI backend"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.29",
    "geoalchemy2>=0.15",
    "shapely>=2.0",
    "alembic>=1.13",
    "structlog>=24.0",
    "websockets>=13",
    "numpy>=1.26",
]

[project.optional-dependencies]
dev = [
    "httpx>=0.27",
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "anyio>=4",
    "ruff>=0.5",
    "pdoc>=15",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/revolt_api"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "B", "SIM", "D"]
# D206 (docstring indented with tabs) conflicts with this project's tab indentation, same
# reason E501/W191 are ignored.
ignore = ["E501", "W191", "D206"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["D"]
"migrations/**" = ["D"]

[tool.ruff.format]
quote-style = "double"
indent-style = "tab"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-p no:launch_pytest -m 'not integration'"
markers = [
    "integration: requires a real Postgres/PostGIS connection (docker compose up -d db && alembic upgrade head); run explicitly with -m integration",
]
